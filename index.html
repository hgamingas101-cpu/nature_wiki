<html>
    <head>
        <title> WIKI nature</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous"/>
<link href="css/style2.css" rel="stylesheet" type="text/css"/>
    </head>
    <body>
        <div  class ="contenedor" id="principal">
            <div id ="imagen">
                <img src="images/desktop-wallpaper-nature-background-super-high-resolution-nature.jpg" class="imagen"/>
                <p style="margin-top: 20px;text-align: center; font-size:30px">
                    Bienvenido a Naturewiki</p>
                <div class="form-group" style="text-align: center;">
                    <label style="font-weight: bold ; font-size:30px" >usuario:</label>
                    <p style="margin-top: 20px;text-align: center">
                    <input class="form-group" id="Usuario" type="text" name="txtnom" placeholder="ingrese su usuario" style="display: block; margin-left: auto; margin-right: auto;" />
                    <button id="Acceso" disabled >Acceder</button>
                </div>
            </div>
        </div>
       <script>
    const inputUsuario = document.getElementById("Usuario");
    const botonAcceder = document.getElementById("Acceso");
    
    inputUsuario.addEventListener("input", function() {
        if (inputUsuario.value.trim().length > 0) {
            botonAcceder.disabled = false;
        } else {
            botonAcceder.disabled = true;
        }
    });

    botonAcceder.addEventListener("click", function() {
       
        window.location.href = "inicio.html"; 
    });
</script>
        
    </body>  
</html>
