<html lang="es">
         <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naturewiki - Acceder</title>
    <link href="css/style2.css" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous"/>
</head>

<body>
    <div class="contenedor"> 
        
        <header class="content">
            <span class="logo" aria-hidden="true"
                  >🌳</span>
            <h1>Bienvenido a Naturewiki</h1>
            <p>Una wiki viva y plantas hermosas</p>
        </header>

        <main class="sign">
            <h2>Acceder</h2>
            
            <form id="loginForm" action="#" method="POST"> 
                
                <div class="input-group"> 
                    <label for="inputUsuario">Correo Electrónico / Usuario</label>
                    <input 
                        type="text" 
                        id="inputUsuario" 
                        placeholder="Usuario o correo" 
                        required 
                        oninput="validarAcceso()" 
                    >
                </div>
                
                <div class="input-group"> 
                    <label for="inputPassword">Contraseña</label>
                    <input 
                        type="password" 
                        id="inputPassword" 
                        placeholder="Mínimo 8 caracteres" 
                        required
                    >
                </div>
                
                <button type="submit" id="botonAcceso" disabled class="btn-primary">
                    Acceder
                </button>
                
            </form>
            
        </main>
    </div>
    
    <script>
        
        const inputUsuario = document.getElementById("inputUsuario");
        const botonAcceso = document.getElementById("botonAcceso");
        function validarAcceso() {
            botonAcceso.disabled = inputUsuario.value.trim().length === 0;
        }
        inputUsuario.addEventListener("input", validarAcceso);
        botonAcceso.addEventListener("click", function(event) {
            event.preventDefault();  
            
                        window.location.href = "inicio.html"; 
        });
        document.addEventListener('DOMContentLoaded', validarAcceso);
        
        
    </script>
</body>
</html>
